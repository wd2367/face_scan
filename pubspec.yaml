name: face_scan
description: Android 人脸扫描插件，提供相机预览、测量控制和状态事件。
version: 0.1.1
homepage: https://github.com/wd2367/face_scan
repository: https://github.com/wd2367/face_scan
issue_tracker: https://github.com/wd2367/face_scan/issues

environment:
  sdk: ^3.13.5
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: dev.facescan.core
        pluginClass: FaceScanPlugin
